<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
    <title>Calculator</title>

    <!-- The harness: the app alone, no desktop, F5 to develop.
         The kit is the repo's own vendored copy (autark — no CDN); kit/VERSION
         says which release it is. On a desktop the host's kit is live instead,
         so keep the two on the same version. -->
    <link rel="stylesheet" href="kit/css/ui.css">
    <script defer src="kit/js/all.js"></script>

    <script defer>
        // The app is injected AFTER the kit — exactly what a desktop does
        // before it opens you. (all.js injects its scripts, and injected
        // scripts do not hold up DOMContentLoaded, so a plain
        // <script defer src="app.js"> would run too early and find no sac.)
        function loadApp() {
            const s = document.createElement("script");
            s.src = "app.js";
            document.head.appendChild(s);
        }
        if (window.sacReady) loadApp();
        else document.addEventListener("sac:ready", loadApp, { once: true });
    </script>

    <style>
        /* Harness only — not part of the app. */
        /* The app's identity, as a desktop would seed it from app.json —
           this page never loads on a host, so :root is safely our own. */
        :root { --accent: #7c3aed; }
        body { padding: 2rem; }
        .frame {
            max-width: 320px;
            height: 440px;
            padding: 1rem;
            display: flex;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-l);
        }
        .frame > * { flex: 1; }
    </style>
</head>
<body>
    <!-- Roughly the box a <sac-window> would give it on a desktop. With no
         host calling mount(), sac.app.Element mounts the app itself. -->
    <div class="frame"><app-calculator></app-calculator></div>
</body>
</html>
